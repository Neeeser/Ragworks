[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ragworks"
version = "0.5.2"
description = "Modular Pinecone-backed retrieval toolkit for Ragworks."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pinecone>=5.0.0",
    "umap-learn>=0.5.5",
    "pydantic>=2.6.0",
    "pypdf>=4.0.0",
    "fastapi>=0.111.0,<0.126",
    "uvicorn[standard]>=0.29.0",
    "sqlmodel>=0.0.16",
    "psycopg[binary]>=3.2.0",
    "httpx>=0.27.0",
    "openai>=1.30.5",
    "passlib[argon2]>=1.7.4",
    "argon2-cffi>=23.1.0",
    "python-jose[cryptography]>=3.3.0",
    "python-multipart>=0.0.9",
    "tiktoken>=0.5.0",
    "pydantic-settings>=2.2.1",
    "email-validator>=2.1.0",
    "pgvector>=0.5.0",
    "tokenizers>=0.22.1",
    "structlog>=24.1.0",
]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=5",
    "coverage[toml]>=7.6",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-python-jose>=3.3",
    "types-passlib>=1.7",
    "pytest-xdist>=3.6",
    "filelock>=3.13",
]

[tool.uv]
# This repository is an "application-style" layout (run from the repo root).
# Avoid packaging/installing the project itself; just manage dependencies + venv.
package = false
default-groups = ["dev"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# The design-budget rules (PLR09xx) replace pylint outright, at the thresholds
# pylint enforced (max-args=6 below; branches/statements/locals keep the shared
# 12/50/15 defaults). PLR0914 (too-many-locals) is preview-only, so preview is
# on with explicit-preview-rules so only explicitly selected preview rules
# activate. Module length stays owned by tests/test_module_size.py.
preview = true
explicit-preview-rules = true
select = [
    "E", "F", "W", "I", "B", "UP", "SIM", "PT", "C90", "RUF",
    "C4",      # comprehensions
    "PERF",    # perflint (manual list/dict building)
    "PIE",     # misc lints
    "ISC",     # implicit string concatenation
    "PTH",     # pathlib over os.path
    "RET",     # return statement hygiene
    "DTZ",     # naive datetimes (app code; tests may construct naive fixtures)
    "T20",     # no print() in app code (logging goes through app/observability)
    "PLR0912", # too-many-branches
    "PLR0913", # too-many-arguments
    "PLR0914", # too-many-locals (preview)
    "PLR0915", # too-many-statements
]
ignore = [
    "E501",  # line length handled by formatter
    "B008",  # FastAPI's Depends()/Query()/Body()/File() as a default is the framework's idiom
]

[tool.ruff.lint.pylint]
max-args = 6

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
# Design budgets apply to app code; test factories legitimately take many
# keyword arguments and construct naive datetimes as fixture values.
"tests/**" = ["C901", "SIM117", "DTZ", "PLR0912", "PLR0913", "PLR0914", "PLR0915"]
# The sandbox CLI's prints are its user interface, not stray debugging.
"sandbox/**" = ["T201"]
# Burn-down list: each entry below is owned by the phase that rewrites the module,
# never a place to park code you don't want to lint. Do not copy this pattern for
# new code.
"app/schemas/enums.py" = ["UP042"]  # TODO(phase-2): remove; `str(member)` differs between a str/Enum mixin and StrEnum -- verify no code depends on the "Class.MEMBER" str() form before switching. Moved here from app/db/models.py when the enums relocated to app.schemas.enums.
"app/schemas/auth.py" = ["UP042"]  # TODO(phase-2): remove; same str(member) caveat as app/schemas/enums.py

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
strict = true

[[tool.mypy.overrides]]
# umap-learn ships no inline types and no `types-umap` stub package exists on
# PyPI. This is a permanent third-party-stubs gap, not a phase burn-down item:
# unlike the `ignore_errors` overrides above (removed once), there is nothing
# to "finish" here short of upstream shipping stubs, so it stays even under
# strict mode.
module = "umap"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# HuggingFace tokenizers ships no inline types or third-party stub package.
module = "tokenizers"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# -n auto: pytest-xdist parallelism; each worker owns a private database
# copied from a schema template (tests/utils/db.py), so test-level
# distribution is safe (no module/session-scoped fixtures share state). For a
# quick single-file run during iteration, `-n 0` skips worker startup.
addopts = ["-q", "--strict-markers", "-n", "auto"]
norecursedirs = ["live"]
markers = [
    "live_provider_reranking: opt-in smoke test that contacts a configured provider",
]

[tool.coverage.run]
branch = true
source = ["app"]
omit = [
    "tests/*",
    "scripts/*",
    "**/__init__.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
# A regression ratchet, not a target: it exists to catch a body of new
# untested code, not to police fractions. Measured branch coverage is ~94%, so
# a 90 floor leaves enough headroom that an honest PR never fails the gate by
# hundredths of a point -- a near-miss stall costs more agent time than the
# handful of lines it protects. Lowering it to make a change pass is still not
# a fix; find out why coverage dropped.
fail_under = 90
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
"app.retrieval.tokenizers.data" = ["*.json", "*.tiktoken"]
